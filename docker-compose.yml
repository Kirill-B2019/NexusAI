services:
  model-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: nexus-model
    command: >
      --model /models/Qwen3-4B-Q4_K_M.gguf
      --threads 7
      --ctx-size 8192
      --batch-size 512
      --parallel 2
      --cont-batching
      --load-mode mmap+mlock
      --host 0.0.0.0
      --port 8080
    volumes:
      - ./models:/models
      - ./loras:/loras
    mem_limit: 5G
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexusai
      POSTGRES_USER: nexusai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      -c shared_buffers=2GB
      -c work_mem=16MB
      -c max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 3G
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexus-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 2G
    restart: unless-stopped

  embeddings:
    build: ./embeddings
    container_name: nexus-embeddings
    environment:
      - EMBEDDING_MODEL=intfloat/multilingual-e5-small
    volumes:
      - embeddings_cache:/app/.cache/huggingface
    mem_limit: 1G
    restart: unless-stopped

  api:
    build: ./api
    container_name: nexus-api
    environment:
      - MODEL_SERVER_URL=http://nexus-model:8080
      - MODEL_TIMEOUT=900
      - EXPERT_TIMEOUT=900
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=http://nexus-qdrant:6333
      - EMBEDDINGS_URL=http://nexus-embeddings:8001
      - DOCUMENTS_DIR=/app/data/documents
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - documents_data:/app/data/documents
    depends_on:
      - model-server
      - postgres
      - qdrant
      - embeddings
    mem_limit: 1G
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/index.html:/usr/share/nginx/html/index.html
      - ./nginx/debug:/usr/share/nginx/html/debug
    depends_on:
      - api
    mem_limit: 128M
    restart: unless-stopped

  # ─── Мониторинг ──────────────────────────────────────────
  nexus-prometheus:
    image: prom/prometheus:v2.55.0
    container_name: nexus-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    mem_limit: 512M
    restart: unless-stopped

  nexus-grafana:
    image: grafana/grafana:11.3.0
    container_name: nexus-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin_change_me}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://31.128.38.96:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    mem_limit: 256M
    restart: unless-stopped

  nexus-node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: nexus-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    mem_limit: 64M
    restart: unless-stopped

  nexus-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: nexus-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://nexusai:${POSTGRES_PASSWORD}@nexus-postgres:5432/nexusai?sslmode=disable
    depends_on:
      - postgres
    mem_limit: 64M
    restart: unless-stopped

  nexus-nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nexus-nginx-exporter
    command:
      - '--nginx.scrape-uri=http://nexus-nginx:80/nginx_status'
    depends_on:
      - nginx
    mem_limit: 32M
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  embeddings_cache:
  documents_data:
  prometheus_data:
  grafana_data:
