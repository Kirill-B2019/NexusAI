global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'nexus-ai'

scrape_configs:
  # Сам Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Метрики хоста (CPU, RAM, диск, сеть)
  - job_name: 'node'
    static_configs:
      - targets: ['nexus-node-exporter:9100']

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['nexus-postgres-exporter:9187']

  # Qdrant (встроенные метрики)
  - job_name: 'qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nexus-qdrant:6333']

  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nexus-nginx-exporter:9113']

  # NEXUS AI API (добавим позже)
  - job_name: 'nexus-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nexus-api:8000']
