<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEXUS AI — Документы (debug)</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 20px auto; padding: 20px; background: #fafafa; }
h1 { color: #1a1a2e; margin: 0 0 20px; }
.panel { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
input[type=text], input[type=password], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 12px; font-family: inherit; }
textarea { min-height: 80px; resize: vertical; }
button { padding: 10px 16px; border-radius: 6px; border: none; background: #1a1a2e; color: #fff; cursor: pointer; font-size: 14px; }
button:hover { background: #2d2d5e; }
button:disabled { background: #888; cursor: not-allowed; }
button.danger { background: #dc2626; }
button.danger:hover { background: #b91c1c; }
button.ask { background: #16a34a; }
button.ask:hover { background: #15803d; }
#dropzone { border: 2px dashed #bbb; border-radius: 8px; padding: 40px; text-align: center; color: #888; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
#dropzone.drag { border-color: #16a34a; background: #f0fff4; color: #16a34a; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #f5f5f5; font-weight: 600; }
tr:hover { background: #f9f9f9; }
.status { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.status.pending { background: #fff3cd; color: #856404; }
.status.processing { background: #cce5ff; color: #004085; }
.status.ready { background: #d4edda; color: #155724; }
.status.failed { background: #f8d7da; color: #721c24; }
.progress { margin-top: 8px; font-size: 13px; color: #666; }
.error { color: #dc2626; font-size: 13px; margin-top: 8px; }
.hidden { display: none; }
.modal-bg { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: #fff; border-radius: 8px; padding: 24px; max-width: 700px; width: 90%; max-height: 85vh; overflow-y: auto; }
.modal h3 { margin-top: 0; }
.answer { background: #f5f5f5; padding: 16px; border-radius: 6px; margin-top: 12px; white-space: pre-wrap; }
.sources-list { margin-top: 12px; font-size: 12px; color: #666; }
.sources-list div { margin-bottom: 4px; }
</style>
</head>
<body>
<h1>NEXUS AI — Документы (debug UI)</h1>

<div class="panel">
  <label>Admin API-ключ</label>
  <input type="password" id="apiKey" placeholder="X-API-Key">
  <label>Project ID</label>
  <input type="text" id="projectId" placeholder="UUID проекта">
  <button onclick="loadDocs()">Загрузить список</button>
</div>

<div class="panel">
  <div id="dropzone" onclick="document.getElementById('fileInput').click()">
    <div>📎 Перетащите файл сюда или нажмите для выбора</div>
    <div style="font-size:12px;margin-top:8px;">Поддержка: TXT, MD, PDF, DOCX, XLSX, XLS, CSV, ODS, код</div>
  </div>
  <input type="file" id="fileInput" class="hidden" onchange="uploadFile(this.files[0])">
  <div class="progress" id="progress"></div>
  <div class="error" id="error"></div>
</div>

<div class="panel">
  <h3 style="margin-top:0;">Документы проекта</h3>
  <table>
    <thead>
      <tr>
        <th>Файл</th>
        <th>Размер</th>
        <th>Статус</th>
        <th>Чанков</th>
        <th>Создан</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody id="docsTable">
      <tr><td colspan="6" style="text-align:center;color:#888;">Нет данных</td></tr>
    </tbody>
  </table>
</div>

<script>
const $ = (id) => document.getElementById(id);
let currentDocs = [];

function getAuth() {
  const key = $('apiKey').value.trim();
  const pid = $('projectId').value.trim();
  if (!key) { alert('Введите API-ключ'); return null; }
  if (!pid) { alert('Введите Project ID'); return null; }
  return { key, pid };
}

function formatSize(bytes) {
  if (!bytes) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('ru-RU');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadDocs() {
  const auth = getAuth();
  if (!auth) return;

  try {
    const r = await fetch(`/api/v1/projects/${auth.pid}/documents`, {
      headers: { 'X-API-Key': auth.key }
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Ошибка');
    currentDocs = data.documents || [];
    renderTable();
    if (currentDocs.some(d => d.status === 'pending' || d.status === 'processing')) {
      setTimeout(loadDocs, 3000);
    }
  } catch (e) {
    $('error').textContent = 'Ошибка: ' + e.message;
  }
}

function renderTable() {
  const tbody = $('docsTable');
  if (!currentDocs.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;">Нет документов</td></tr>';
    return;
  }

  tbody.innerHTML = currentDocs.map(d => `
    <tr>
      <td>${escapeHtml(d.original_filename)}</td>
      <td>${formatSize(d.file_size)}</td>
      <td><span class="status ${d.status}">${d.status}</span></td>
      <td>${d.chunks_count}</td>
      <td>${formatDate(d.created_at)}</td>
      <td>
        ${d.status === 'ready' ? `<button class="ask" onclick="askDoc('${d.id}', '${escapeHtml(d.original_filename)}')" style="font-size:12px;padding:4px 8px;" title="Спросить по документу">💬</button>` : ''}
        <button onclick="reindex('${d.id}')" style="font-size:12px;padding:4px 8px;" title="Переиндексировать">↻</button>
        <button class="danger" onclick="delDoc('${d.id}', '${escapeHtml(d.original_filename)}')" style="font-size:12px;padding:4px 8px;" title="Удалить">✕</button>
      </td>
    </tr>
  `).join('');
}

async function uploadFile(file) {
  if (!file) return;
  const auth = getAuth();
  if (!auth) return;

  $('error').textContent = '';
  $('progress').textContent = `Загрузка ${file.name} (${formatSize(file.size)})...`;

  const fd = new FormData();
  fd.append('file', file);

  try {
    const r = await fetch(`/api/v1/projects/${auth.pid}/documents`, {
      method: 'POST',
      headers: { 'X-API-Key': auth.key },
      body: fd
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Ошибка загрузки');
    $('progress').textContent = `✓ ${file.name} загружен, обработка запущена`;
    loadDocs();
  } catch (e) {
    $('progress').textContent = '';
    $('error').textContent = 'Ошибка: ' + e.message;
  }
}

async function reindex(id) {
  const auth = getAuth();
  if (!auth) return;
  if (!confirm('Переиндексировать документ?')) return;

  try {
    const r = await fetch(`/api/v1/documents/${id}/reindex`, {
      method: 'POST',
      headers: { 'X-API-Key': auth.key }
    });
    if (!r.ok) throw new Error((await r.json()).detail);
    loadDocs();
  } catch (e) {
    alert('Ошибка: ' + e.message);
  }
}

async function delDoc(id, name) {
  const auth = getAuth();
  if (!auth) return;
  if (!confirm(`Удалить "${name}"? Векторы также будут удалены.`)) return;

  try {
    const r = await fetch(`/api/v1/documents/${id}`, {
      method: 'DELETE',
      headers: { 'X-API-Key': auth.key }
    });
    if (!r.ok && r.status !== 204) throw new Error('Ошибка удаления');
    loadDocs();
  } catch (e) {
    alert('Ошибка: ' + e.message);
  }
}

// ─── Модальное окно «Спросить по документу» ───────────────
function askDoc(docId, docName) {
  const auth = getAuth();
  if (!auth) return;

  const html = `
    <div class="modal-bg" id="askModalBg">
      <div class="modal">
        <h3>💬 Вопрос по документу</h3>
        <div style="font-size:13px;color:#666;margin-bottom:12px;">${escapeHtml(docName)}</div>
        <label>Вопрос</label>
        <textarea id="askQuestion" placeholder="Например: о чём этот документ?"></textarea>
        <label>Эксперт</label>
        <select id="askExpert" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:12px;font-size:14px;">
          <option value="system_architect">🏗 Системный архитектор</option>
          <option value="fintech">💰 Финтех-эксперт</option>
          <option value="digital_law">⚖️ Цифровое право</option>
          <option value="software_engineer">💻 Инженер-программист</option>
          <option value="project_scoring">📊 Скоринг проектов</option>
          <option value="investment_advisor">📈 Инвестсоветник</option>
        </select>
        <button class="ask" onclick="askSubmit('${docId}')">Спросить</button>
        <button onclick="document.getElementById('askModalBg').remove()" style="background:#888;">Отмена</button>
        <div id="askResult"></div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
  $('askQuestion').focus();
}

async function askSubmit(docId) {
  const auth = getAuth();
  if (!auth) return;

  const message = $('askQuestion').value.trim();
  const expert = $('askExpert').value;
  if (!message) { alert('Введите вопрос'); return; }

  const resultDiv = $('askResult');
  resultDiv.innerHTML = '<div class="progress">⏳ Думаем... Это может занять 1-3 минуты.</div>';

  try {
    const r = await fetch(`/api/v1/documents/${docId}/ask`, {
      method: 'POST',
      headers: {
        'X-API-Key': auth.key,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message, expert, rag_top_k: 6, rag_min_score: 0.4 })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Ошибка');

    let html = '';
    if (data.rag_used) {
      html += `<div class="answer">${escapeHtml(data.content || '')}</div>`;
      if (data.sources && data.sources.length) {
        html += `<div class="sources-list"><strong>Источники:</strong>`;
        data.sources.forEach(s => {
          html += `<div>[${s.index}] чанк ${s.chunk_index}, score=${s.score}</div>`;
        });
        html += `</div>`;
      }
    } else {
      html += `<div class="answer">📄 ${escapeHtml(data.message || 'Нет данных')}</div>`;
    }
    resultDiv.innerHTML = html;
  } catch (e) {
    resultDiv.innerHTML = `<div class="error">Ошибка: ${escapeHtml(e.message)}</div>`;
  }
}

// Drag & drop
const dz = $('dropzone');
['dragenter', 'dragover'].forEach(ev => {
  dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); });
});
['dragleave', 'drop'].forEach(ev => {
  dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); });
});
dz.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) uploadFile(file);
});
</script>
</body>
</html>
