<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEXUS AI — Chat (SSE)</title>
<style>
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 16px auto; padding: 16px; background: #fafafa; }
h1 { color: #1a1a2e; margin: 0 0 16px; font-size: 22px; }
.panel { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
input[type=text], input[type=password], textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-family: inherit; }
textarea { min-height: 70px; resize: vertical; }
button { padding: 8px 14px; border-radius: 6px; border: none; background: #1a1a2e; color: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
button:hover { background: #2d2d5e; }
button:disabled { background: #888; cursor: not-allowed; }
button.secondary { background: #666; }
button.secondary:hover { background: #444; }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; }
.experts-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; font-size: 12px; }
.experts-list label { display: flex; align-items: center; gap: 6px; margin: 0; padding: 6px 8px; background: #f5f5f5; border-radius: 4px; cursor: pointer; }
.experts-list label:hover { background: #eee; }
.experts-list input[type=checkbox] { margin: 0; }
#chat { border: 1px solid #ddd; border-radius: 8px; padding: 16px; height: 550px; overflow-y: auto; background: #fff; margin-bottom: 12px; }
.msg { margin: 12px 0; padding: 12px 16px; border-radius: 8px; max-width: 90%; }
.msg.user { background: #e3f2fd; margin-left: auto; }
.msg.meta { font-size: 11px; color: #888; margin: 4px 0; padding: 4px 8px; background: #f9f9f9; border-radius: 4px; }
.msg.expert { background: #fff; border-left: 4px solid #666; }
.expert-name { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
.expert-content { white-space: pre-wrap; word-wrap: break-word; font-size: 14px; line-height: 1.5; }
.expert-reasoning { font-size: 12px; color: #666; margin-top: 8px; padding: 8px; background: #fafafa; border-radius: 4px; }
.expert-reasoning summary { cursor: pointer; user-select: none; }
.expert-reasoning pre { margin: 4px 0 0; white-space: pre-wrap; font-family: inherit; }
.status { font-size: 12px; color: #666; margin: 4px 0; }
.status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #999; margin-right: 6px; vertical-align: middle; }
.status.active .dot { background: #16a34a; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.error { color: #dc2626; font-size: 12px; padding: 8px; background: #fef2f2; border-radius: 4px; }
.sources { font-size: 11px; color: #666; margin-top: 8px; padding-top: 6px; border-top: 1px dashed #ddd; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
</style>
</head>
<body>
<h1>NEXUS AI — Chat (SSE debug UI)</h1>

<div class="panel">
  <div class="row">
    <div>
      <label>Admin API-ключ</label>
      <input type="password" id="apiKey" placeholder="X-API-Key">
    </div>
    <div>
      <label>Project ID (для RAG, опционально)</label>
      <input type="text" id="projectId" placeholder="UUID">
    </div>
  </div>
</div>

<div class="panel">
  <label>Режим</label>
  <select id="mode" onchange="onModeChange()">
    <option value="auto">Авто-выбор (роутер)</option>
    <option value="single">Один эксперт</option>
    <option value="manual">Ручной список</option>
  </select>

  <div id="singleBlock" style="display:none; margin-top: 8px;">
    <label>Эксперт</label>
    <select id="singleExpert">
      <option value="system_architect">🏗 Системный архитектор</option>
      <option value="software_engineer">💻 Инженер-программист</option>
      <option value="fintech">💰 Финтех-эксперт</option>
      <option value="digital_law">⚖️ Цифровое право</option>
      <option value="project_scoring">📊 Скоринг проектов</option>
      <option value="investment_advisor">📈 Инвестсоветник</option>
    </select>
  </div>

  <div id="manualBlock" style="display:none; margin-top: 8px;">
    <label>Выберите экспертов (макс. 4)</label>
    <div class="experts-list">
      <label><input type="checkbox" value="system_architect"> 🏗 Архитектор</label>
      <label><input type="checkbox" value="software_engineer"> 💻 Программист</label>
      <label><input type="checkbox" value="fintech"> 💰 Финтех</label>
      <label><input type="checkbox" value="digital_law"> ⚖️ Право</label>
      <label><input type="checkbox" value="project_scoring"> 📊 Скоринг</label>
      <label><input type="checkbox" value="investment_advisor"> 📈 Инвест</label>
    </div>
  </div>

  <div class="toolbar">
    <label style="display:flex;align-items:center;gap:4px;margin:0;font-size:13px;">
      <input type="checkbox" id="thinking"> Thinking
    </label>
    <label style="display:flex;align-items:center;gap:4px;margin:0;font-size:13px;">
      <input type="checkbox" id="useRag" checked> RAG
    </label>
    <button class="secondary" onclick="clearChat()">Очистить</button>
  </div>
</div>

<div id="chat">
  <div class="status" style="text-align:center;color:#888;margin-top:200px;">
    Введите вопрос и нажмите «Отправить»
  </div>
</div>

<div class="panel">
  <label>Сообщение</label>
  <textarea id="message" placeholder="Введите вопрос..." autofocus></textarea>
  <div class="toolbar">
    <button id="sendBtn" onclick="send()">Отправить</button>
    <span class="status" id="statusText"></span>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const chat = $('chat');

function onModeChange() {
  const mode = $('mode').value;
  $('singleBlock').style.display = mode === 'single' ? 'block' : 'none';
  $('manualBlock').style.display = mode === 'manual' ? 'block' : 'none';
}

function clearChat() {
  chat.innerHTML = '<div class="status" style="text-align:center;color:#888;margin-top:200px;">Очищено</div>';
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const expertNames = {
  system_architect: { name: 'Системный архитектор', icon: '🏗', color: '#2563eb' },
  software_engineer: { name: 'Инженер-программист', icon: '💻', color: '#16a34a' },
  fintech: { name: 'Финтех-эксперт', icon: '💰', color: '#eab308' },
  digital_law: { name: 'Эксперт по цифровому праву', icon: '⚖️', color: '#dc2626' },
  project_scoring: { name: 'Эксперт по проектному скорингу', icon: '📊', color: '#7c3aed' },
  investment_advisor: { name: 'Инвестиционный советник', icon: '📈', color: '#0d9488' },
};

function expertLabel(key) {
  const e = expertNames[key] || { name: key, icon: '🤖', color: '#666' };
  return `${e.icon} ${e.name}`;
}

let currentExpertBlock = null;
let currentExpertContent = '';
let currentExpertReasoning = '';

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addMeta(text) {
  const div = document.createElement('div');
  div.className = 'msg meta';
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function startExpert(key) {
  const e = expertNames[key] || { name: key, icon: '🤖', color: '#666' };
  const div = document.createElement('div');
  div.className = 'msg expert';
  div.style.borderLeftColor = e.color;
  div.innerHTML = `
    <div class="expert-name" style="color:${e.color}">${e.icon} ${escapeHtml(e.name)}</div>
    <div class="expert-content"></div>
    <details class="expert-reasoning" style="display:none;">
      <summary>💭 Размышления</summary>
      <pre></pre>
    </details>
  `;
  chat.appendChild(div);
  currentExpertBlock = div;
  currentExpertContent = '';
  currentExpertReasoning = '';
  chat.scrollTop = chat.scrollHeight;
}

function addToken(delta) {
  if (!currentExpertBlock) return;
  currentExpertContent += delta;
  currentExpertBlock.querySelector('.expert-content').textContent = currentExpertContent;
  chat.scrollTop = chat.scrollHeight;
}

function addReasoning(delta) {
  if (!currentExpertBlock) return;
  currentExpertReasoning += delta;
  const details = currentExpertBlock.querySelector('.expert-reasoning');
  details.style.display = 'block';
  details.querySelector('pre').textContent = currentExpertReasoning;
}

function addSources(sources) {
  if (!sources || !sources.length) return;
  const div = document.createElement('div');
  div.className = 'sources';
  div.innerHTML = '<strong>Источники:</strong><br>' + sources.map(s => 
    `[${s.index}] ${escapeHtml(s.document_name || s.document_id?.slice(0,8) || 'doc')} — chunk ${s.chunk_index}, score ${s.score}`
  ).join('<br>');
  chat.appendChild(div);
}

function addError(text) {
  const div = document.createElement('div');
  div.className = 'error';
  div.textContent = '⚠ ' + text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const apiKey = $('apiKey').value.trim();
  const projectId = $('projectId').value.trim();
  const message = $('message').value.trim();
  const mode = $('mode').value;
  const thinking = $('thinking').checked;
  const useRag = $('useRag').checked;

  if (!apiKey) { alert('Введите API-ключ'); return; }
  if (!message) { alert('Введите сообщение'); return; }

  let expert = null;
  let experts = null;

  if (mode === 'single') {
    expert = $('singleExpert').value;
  } else if (mode === 'manual') {
    experts = Array.from(document.querySelectorAll('#manualBlock input[type=checkbox]:checked'))
      .map(c => c.value);
    if (!experts.length) { alert('Выберите хотя бы одного эксперта'); return; }
  }

  addUserMessage(message);
  $('message').value = '';
  $('sendBtn').disabled = true;
  $('statusText').innerHTML = '<span class="dot"></span> Генерация...';
  $('statusText').classList.add('active');

  const body = {
    message,
    thinking,
    use_rag: useRag,
  };
  if (expert) body.expert = expert;
  if (experts) body.experts = experts;
  if (projectId) body.project_id = projectId;

  try {
    const response = await fetch('/api/v1/chat/stream', {
      method: 'POST',
      headers: {
        'X-API-Key': apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      addError(`${response.status}: ${err.detail || 'Ошибка'}`);
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split('\n\n');
      buffer = events.pop() || '';

      for (const ev of events) {
        const lines = ev.split('\n');
        let eventType = 'message';
        let dataLine = '';
        for (const line of lines) {
          if (line.startsWith('event: ')) eventType = line.slice(7).trim();
          else if (line.startsWith('data: ')) dataLine = line.slice(6);
        }
        if (!dataLine) continue;
        let payload;
        try { payload = JSON.parse(dataLine); } catch(e) { continue; }

        if (eventType === 'start') {
          addMeta(`Режим: ${payload.mode} · Эксперты: ${payload.experts_used.map(expertLabel).join(', ')} · RAG: ${payload.rag_used ? 'да' : 'нет'}`);
          if (payload.sources && payload.sources.length) addSources(payload.sources);
        } else if (eventType === 'expert_start') {
          startExpert(payload.expert);
        } else if (eventType === 'token') {
          addToken(payload.delta);
        } else if (eventType === 'reasoning') {
          addReasoning(payload.delta);
        } else if (eventType === 'expert_done') {
          // ничего
        } else if (eventType === 'expert_error') {
          addError(`Эксперт ${payload.expert}: ${payload.error}`);
        } else if (eventType === 'done') {
          addMeta(`Готово за ${payload.elapsed_s}s · ${payload.summary.ok}/${payload.summary.total} экспертов`);
        } else if (eventType === 'error') {
          addError(payload.error);
        }
      }
    }
  } catch (e) {
    addError('Ошибка сети: ' + e.message);
  } finally {
    $('sendBtn').disabled = false;
    $('statusText').innerHTML = '';
    $('statusText').classList.remove('active');
    $('message').focus();
  }
}

$('message').addEventListener('keypress', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send();
});
</script>
</body>
</html>
